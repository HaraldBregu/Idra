services:
  app:
    build:
      context: .
    init: true
    ports:
      - '${IDRA_BIND_ADDRESS:-127.0.0.1}:${IDRA_PORT:-3000}:3000'
    environment:
      IDRA_PUBLIC_URL: ${IDRA_PUBLIC_URL:?set IDRA_PUBLIC_URL in .env}
      IDRA_ADMIN_TOKEN: ${IDRA_ADMIN_TOKEN:?set IDRA_ADMIN_TOKEN in .env}
      IDRA_CONFIG_KEY: ${IDRA_CONFIG_KEY:?set IDRA_CONFIG_KEY in .env}
      IDRA_LISTEN_ADDRESS: 0.0.0.0
    volumes:
      - idra-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  idra-data:
