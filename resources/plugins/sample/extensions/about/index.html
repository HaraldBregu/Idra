<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Sample About</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				padding: 2rem;
				background: Canvas;
				color: CanvasText;
				max-width: 36rem;
			}
			h1 {
				margin: 0 0 0.25rem;
				font-size: 1.4rem;
			}
			p.subtitle {
				margin: 0 0 1.5rem;
				opacity: 0.7;
			}
			dl {
				display: grid;
				grid-template-columns: max-content 1fr;
				gap: 0.5rem 1.5rem;
			}
			dt {
				font-weight: 600;
			}
			dd {
				margin: 0;
			}
		</style>
	</head>
	<body>
		<h1>Sample Plugin</h1>
		<p class="subtitle">A reference plugin showing the standardized Friday plugin layout.</p>
		<dl>
			<dt>Extensions</dt>
			<dd>Sample Todo, Sample About</dd>
			<dt>Skill</dt>
			<dd>Translator (English ↔ Latin)</dd>
			<dt>Provider</dt>
			<dd>Sample AI — openai-compatible, 2 models</dd>
			<dt>MCP server</dt>
			<dd>Sample Tools (stdio)</dd>
			<dt>Language</dt>
			<dd>Latina (la)</dd>
			<dt>Theme</dt>
			<dd>Sunrise (light)</dd>
			<dt>Channel</dt>
			<dd>Relay</dd>
		</dl>
	</body>
</html>
