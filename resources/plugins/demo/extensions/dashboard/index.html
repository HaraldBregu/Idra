<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Demo Dashboard</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				padding: 2rem;
				background: Canvas;
				color: CanvasText;
			}
			h1 {
				margin: 0 0 0.25rem;
				font-size: 1.4rem;
			}
			p.subtitle {
				margin: 0 0 1.5rem;
				opacity: 0.7;
			}
			.grid {
				display: grid;
				grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
				gap: 1rem;
			}
			.card {
				border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
				border-radius: 8px;
				padding: 1rem;
			}
			.card .value {
				font-size: 1.8rem;
				font-weight: 600;
			}
			.card .label {
				opacity: 0.7;
				font-size: 0.85rem;
			}
		</style>
	</head>
	<body>
		<h1>Demo Dashboard</h1>
		<p class="subtitle">A sample extension page contributed by the Demo Plugin.</p>
		<div class="grid">
			<div class="card"><div class="value">42</div><div class="label">Tasks completed</div></div>
			<div class="card"><div class="value">7</div><div class="label">Projects</div></div>
			<div class="card"><div class="value">3</div><div class="label">Channels connected</div></div>
			<div class="card"><div class="value" id="clock">--:--</div><div class="label">Local time</div></div>
		</div>
		<script>
			const clock = document.getElementById('clock');
			const tick = () =>
				(clock.textContent = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }));
			tick();
			setInterval(tick, 1000);
		</script>
	</body>
</html>
