<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Demo Notes</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}
			body {
				margin: 0;
				padding: 2rem;
				background: Canvas;
				color: CanvasText;
				display: flex;
				flex-direction: column;
				gap: 1rem;
				height: 100vh;
				box-sizing: border-box;
			}
			h1 {
				margin: 0;
				font-size: 1.4rem;
			}
			textarea {
				flex: 1;
				resize: none;
				padding: 0.75rem;
				border-radius: 8px;
				border: 1px solid color-mix(in srgb, CanvasText 15%, transparent);
				background: transparent;
				color: inherit;
				font: inherit;
			}
			small {
				opacity: 0.7;
			}
		</style>
	</head>
	<body>
		<h1>Demo Notes</h1>
		<textarea id="notes" placeholder="Type a note — it is saved locally as you type."></textarea>
		<small id="status">Notes are stored in this extension's local storage.</small>
		<script>
			const notes = document.getElementById('notes');
			const status = document.getElementById('status');
			notes.value = localStorage.getItem('demo-notes') ?? '';
			notes.addEventListener('input', () => {
				localStorage.setItem('demo-notes', notes.value);
				status.textContent = 'Saved at ' + new Date().toLocaleTimeString();
			});
		</script>
	</body>
</html>
