  <rect width="1323" height="1189" fill="#000"/>

  <g transform="translate(661 580) rotate(-4)">
    <ellipse rx="600" ry="72" fill="none" stroke="url(#ring)" stroke-width="9" filter="url(#glow)"/>
    <ellipse rx="600" ry="72" fill="none" stroke="url(#ring)" stroke-width="6"/>
  </g>

  <circle cx="661" cy="580" r="345" fill="url(#sphere)"/>

  <g transform="translate(661 580) rotate(-4)" clip-path="url(#front)">
    <ellipse rx="600" ry="72" fill="none" stroke="url(#ring)" stroke-width="9" filter="url(#glow)"/>
    <ellipse rx="600" ry="72" fill="none" stroke="url(#ring)" stroke-width="6"/>
  </g>
</svg>
