<svg width="100%" viewBox="0 0 688 688" role="img" xmlns="http://www.w3.org/2000/svg" style=""><title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Gradient planet with single orbit on transparent background</title><desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">A glowing gradient sphere with one orbital ring filling the canvas, with a fully transparent background.</desc>
<defs>
<radialGradient id="planetD" cx="62%" cy="38%" r="85%">
<stop offset="0%" stop-color="#ffb347"/>
<stop offset="28%" stop-color="#ff8a3d"/>
<stop offset="52%" stop-color="#f4436c"/>
<stop offset="75%" stop-color="#e0335f"/>
<stop offset="100%" stop-color="#5b21b6"/>
