<stop offset="60%" stop-color="#f4436c" stop-opacity="0.35"/>
<stop offset="100%" stop-color="#f4436c" stop-opacity="0"/>
</radialGradient>
<linearGradient id="ringD" x1="100%" y1="0%" x2="0%" y2="100%">
<stop offset="0%" stop-color="#ff9838"/>
<stop offset="55%" stop-color="#ff2d78"/>
