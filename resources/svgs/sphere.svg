<svg xmlns="http://www.w3.org/2000/svg"
     width="404" height="404" viewBox="54 54 404 404"
     role="img" aria-labelledby="title desc">
  <title id="title">Neon flowing sphere logo</title>
  <desc id="desc">A centered spherical logo with flowing magenta, purple, red, and orange bands on a transparent background.</desc>

  <defs>
    <clipPath id="sphereClip">
      <circle cx="256" cy="256" r="202"/>
    </clipPath>

    <radialGradient id="baseGrad" cx="68%" cy="32%" r="78%">
      <stop offset="0%" stop-color="#ff6a00"/>
      <stop offset="26%" stop-color="#d72618"/>
      <stop offset="56%" stop-color="#60104d"/>
      <stop offset="79%" stop-color="#24103f"/>
      <stop offset="100%" stop-color="#080611"/>
    </radialGradient>

    <linearGradient id="upperBand" x1="0%" y1="8%" x2="100%" y2="88%">
      <stop offset="0%" stop-color="#ff16da"/>
      <stop offset="34%" stop-color="#f00073"/>
      <stop offset="68%" stop-color="#ff3b0a"/>
      <stop offset="100%" stop-color="#ffb000"/>
    </linearGradient>

    <linearGradient id="midBand" x1="6%" y1="10%" x2="98%" y2="86%">
      <stop offset="0%" stop-color="#4e0bb9"/>
      <stop offset="28%" stop-color="#170628"/>
      <stop offset="62%" stop-color="#6b102d"/>
      <stop offset="100%" stop-color="#ff5a05"/>
    </linearGradient>

    <linearGradient id="lowerBand" x1="4%" y1="8%" x2="92%" y2="96%">
      <stop offset="0%" stop-color="#7d12ff"/>
      <stop offset="35%" stop-color="#271044"/>
      <stop offset="72%" stop-color="#42091f"/>
      <stop offset="100%" stop-color="#ff3720"/>
    </linearGradient>

    <linearGradient id="topShade" x1="6%" y1="4%" x2="95%" y2="90%">
      <stop offset="0%" stop-color="#b6008f"/>
      <stop offset="36%" stop-color="#54104e"/>
      <stop offset="72%" stop-color="#280a19"/>
      <stop offset="100%" stop-color="#c52f08"/>
    </linearGradient>

    <linearGradient id="warmEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff39d8"/>
      <stop offset="42%" stop-color="#ff4e7d"/>
      <stop offset="73%" stop-color="#ff6a00"/>
      <stop offset="100%" stop-color="#fff15a"/>
    </linearGradient>

    <linearGradient id="coolEdge" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#902cff"/>
      <stop offset="48%" stop-color="#f12cff"/>
      <stop offset="100%" stop-color="#ff587c"/>
    </linearGradient>

    <radialGradient id="specular" cx="30%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".22"/>
      <stop offset="42%" stop-color="#ffffff" stop-opacity=".04"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>

    <filter id="glowWarm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCool" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity=".38"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <circle cx="256" cy="256" r="202" fill="url(#baseGrad)"/>

    <g clip-path="url(#sphereClip)">
      <!-- Top cap -->
      <path d="M60 205
               C98 92, 198 42, 314 54
               C393 62, 452 111, 466 175
               C444 221, 398 248, 334 244
               C250 238, 198 181, 126 179
               C98 178, 75 187, 60 205Z"
            fill="url(#topShade)"/>

      <!-- Upper glowing ribbon -->
      <path d="M49 238
               C88 158, 150 136, 213 166
               C279 197, 318 246, 388 247
               C426 248, 451 230, 468 201
               L470 281
               C444 328, 402 346, 350 331
               C285 312, 243 259, 180 244
               C122 230, 82 247, 52 286Z"
            fill="url(#upperBand)"/>

      <!-- Middle dark ribbon -->
      <path d="M47 296
               C82 238, 126 218, 182 232
               C251 249, 296 309, 366 318
               C410 324, 446 310, 468 282
               L468 359
               C429 393, 383 400, 330 384
               C266 365, 220 314, 160 303
               C112 295, 76 314, 51 348Z"
            fill="url(#midBand)"/>

      <!-- Lower ribbon -->
      <path d="M58 349
               C98 291, 144 280, 197 299
               C258 321, 298 369, 360 382
               C405 392, 442 379, 464 357
               C448 421, 387 459, 316 466
               C216 476, 118 432, 72 370Z"
            fill="url(#lowerBand)"/>

      <!-- Warm luminous seam -->
      <path d="M53 238
               C91 161, 151 141, 211 169
               C278 200, 320 248, 389 249
               C426 250, 451 233, 467 205"
            fill="none" stroke="url(#warmEdge)" stroke-width="5.5"
            stroke-linecap="round" filter="url(#glowWarm)"/>

      <!-- Cool luminous seam -->
      <path d="M57 349
               C99 292, 145 282, 196 300
               C259 323, 298 370, 360 383
               C405 392, 441 380, 463 359"
            fill="none" stroke="url(#coolEdge)" stroke-width="5"
            stroke-linecap="round" filter="url(#glowCool)"/>

      <!-- Right-side glow -->
      <path d="M466 177
               C475 238, 470 305, 446 357"
            fill="none" stroke="#ff8a00" stroke-opacity=".72" stroke-width="10"
            stroke-linecap="round" filter="url(#glowWarm)"/>

      <!-- Soft specular highlight -->
      <circle cx="256" cy="256" r="202" fill="url(#specular)"/>
    </g>

    <!-- Crisp rim -->
    <circle cx="256" cy="256" r="202"
            fill="none" stroke="#ff2ecb" stroke-opacity=".32" stroke-width="2"/>
  </g>
</svg>
