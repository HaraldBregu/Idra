<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Neon planet with orbital ring</title>
  <desc id="desc">A vector illustration of a magenta, purple, and orange planet with a glowing elliptical ring on a transparent background.</desc>

  <defs>
    <!-- Planet base gradient -->
    <radialGradient id="planetGradient" cx="72%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#ffd36a"/>
      <stop offset="18%" stop-color="#ff9f43"/>
      <stop offset="42%" stop-color="#ff4f5e"/>
      <stop offset="65%" stop-color="#e52082"/>
      <stop offset="82%" stop-color="#8d17b8"/>
      <stop offset="100%" stop-color="#4b08a8"/>
    </radialGradient>

    <!-- Soft secondary shading -->
    <radialGradient id="planetShade" cx="22%" cy="82%" r="82%">
      <stop offset="0%" stop-color="#4b00d4" stop-opacity="0.60"/>
      <stop offset="45%" stop-color="#7d00c8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#ff5c35" stop-opacity="0"/>
    </radialGradient>

    <!-- Ring color gradient -->
    <linearGradient id="ringGradient" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ff1fb8"/>
      <stop offset="45%" stop-color="#ff58e5"/>
      <stop offset="58%" stop-color="#fff0e5"/>
      <stop offset="78%" stop-color="#ff9f2f"/>
      <stop offset="100%" stop-color="#ff5a00"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="ringGlow" x="-40%" y="-80%" width="180%" height="260%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softHighlight" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <!-- Clip lower/front arc of ring -->
    <clipPath id="frontHalf">
      <rect x="0" y="600" width="1200" height="600"/>
    </clipPath>
  </defs>

  <!-- Rear orbital ring -->
  <ellipse cx="600" cy="610" rx="535" ry="112"
           fill="none"
           stroke="url(#ringGradient)"
           stroke-width="8"
           stroke-linecap="round"
           filter="url(#ringGlow)"/>

  <!-- Planet -->
  <circle cx="600" cy="560" r="380" fill="url(#planetGradient)"/>
  <circle cx="600" cy="560" r="380" fill="url(#planetShade)"/>

  <!-- Highlight -->
  <circle cx="790" cy="395" r="82" fill="#ffe07a" opacity="0.28" filter="url(#softHighlight)"/>
  <circle cx="790" cy="395" r="38" fill="#fff1a8" opacity="0.18"/>

  <!-- Front orbital arc only -->
  <ellipse cx="600" cy="610" rx="535" ry="112"
           fill="none"
           stroke="url(#ringGradient)"
           stroke-width="8"
           stroke-linecap="round"
           filter="url(#ringGlow)"
           clip-path="url(#frontHalf)"/>
</svg>
